<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Malgun Gothic, NanumGothic, sans-serif">
  <rect width="1000" height="470" fill="#F4F2F8"/>
  <text x="30" y="38" font-size="21" font-weight="bold" fill="#222">졸업식 당일 하루 동선 — 오전 본식 → 오후 네임콜 수여식</text>
  <text x="30" y="62" font-size="13.5" fill="#222">장소가 바뀌는 순서대로 한 줄씩. 진한 띠가 이름이 불리는 시간.</text>

  <!-- time axis: 09:00 at x=180, 100px per hour, 17:00 at x=980 -->
  <g font-size="12.5" fill="#222" text-anchor="middle">
    <text x="180" y="98">09:00</text><text x="280" y="98">10:00</text><text x="380" y="98">11:00</text>
    <text x="480" y="98">12:00</text><text x="580" y="98">13:00</text><text x="680" y="98">14:00</text>
    <text x="780" y="98">15:00</text><text x="880" y="98">16:00</text><text x="962" y="98">17:00</text>
  </g>
  <g stroke="#9A8FB8" stroke-width="1" stroke-dasharray="3 4">
    <line x1="180" y1="106" x2="180" y2="400"/><line x1="280" y1="106" x2="280" y2="400"/>
    <line x1="380" y1="106" x2="380" y2="400"/><line x1="480" y1="106" x2="480" y2="400"/>
    <line x1="580" y1="106" x2="580" y2="400"/><line x1="680" y1="106" x2="680" y2="400"/>
    <line x1="780" y1="106" x2="780" y2="400"/><line x1="880" y1="106" x2="880" y2="400"/>
    <line x1="980" y1="106" x2="980" y2="400"/>
  </g>

  <!-- halos behind annotations -->
  <g fill="#F4F2F8">
    <rect x="180" y="108" width="72" height="15"/>
    <rect x="226" y="166" width="58" height="15"/>
    <rect x="386" y="127" width="232" height="38"/>
    <rect x="636" y="203" width="136" height="38"/>
    <rect x="434" y="278" width="190" height="38"/>
    <rect x="626" y="317" width="190" height="14"/>
    <rect x="668" y="361" width="156" height="17"/>
  </g>
  <!-- lane labels -->
  <g font-size="14" font-weight="bold" fill="#222">
    <text x="30" y="150">경암체육관</text>
    <text x="30" y="225">교내 지정 구역</text>
    <text x="30" y="300">각 단과대학 강당</text>
    <text x="30" y="375">각 학과</text>
  </g>
  <g stroke="#9A8FB8" stroke-width="1">
    <line x1="30" y1="182" x2="980" y2="182"/><line x1="30" y1="257" x2="980" y2="257"/><line x1="30" y1="332" x2="980" y2="332"/>
  </g>

  <!-- lane 1: 경암체육관 -->
  <rect x="180" y="124" width="66.7" height="40" rx="4" fill="#FFFFFF" stroke="#9A8FB8" stroke-width="1.5"/>
  <text x="213" y="149" font-size="13" text-anchor="middle" fill="#222">입장</text>
  <rect x="246.7" y="124" width="16.6" height="40" fill="#9A8FB8"/>
  <rect x="263.3" y="124" width="111.7" height="40" rx="4" fill="#3B2A6B"/>
  <text x="319" y="149" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#FFFFFF">본식 67′</text>
  <text x="180" y="120" font-size="11.5" fill="#222">09:00-09:40</text>
  <text x="255" y="178" font-size="11.5" text-anchor="middle" fill="#222">식전 연주</text>
  <text x="390" y="141" font-size="12.5" fill="#222">09:40-10:57 · 오전 행사 77′</text>
  <text x="390" y="159" font-size="12.5" fill="#222">학사 수석·박사 전원 (박사 전원 호명 수여)</text>

  <!-- lane 2: 교내 지정 구역 -->
  <rect x="380" y="199" width="250" height="40" rx="4" fill="#9A8FB8"/>
  <text x="505" y="224" font-size="13.5" text-anchor="middle" fill="#222">가족 사진·점심, 꽃 판매 지정 구역</text>
  <text x="640" y="217" font-size="12.5" fill="#222">11:00-13:30</text>
  <text x="640" y="235" font-size="12.5" fill="#222">단과대학 건물 앞 포토존</text>

  <!-- lane 3: 단과대학 강당 -->
  <rect x="630" y="274" width="200" height="40" rx="4" fill="#3B2A6B"/>
  <text x="730" y="299" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#FFFFFF">네임콜 수여식</text>
  <text x="438" y="292" font-size="12.5" fill="#222">13:30-15:30 · 회당 50′ 내외</text>
  <text x="438" y="310" font-size="12.5" fill="#222">학사·석사 사전 신청자 전원 호명</text>
  <text x="630" y="328" font-size="11.5" fill="#222">300명 초과 시 13:30 / 14:30 2회차</text>

  <!-- lane 4: 각 학과 -->
  <rect x="830" y="349" width="150" height="40" rx="4" fill="#FFFFFF" stroke="#9A8FB8" stroke-width="1.5"/>
  <text x="905" y="374" font-size="13" text-anchor="middle" fill="#222">사진 촬영·다과</text>
  <text x="820" y="374" font-size="12.5" text-anchor="end" fill="#222">15:30-17:00 · 학과별 자율</text>

  <!-- flow arrows between lanes -->
  <g stroke="#3B2A6B" stroke-width="2" fill="none">
    <path d="M375 164 L 380 196"/>
    <path d="M630 239 L 630 271"/>
    <path d="M830 314 L 830 346"/>
  </g>
  <g fill="#3B2A6B">
    <path d="M375.5 199 l-4 -8 h8 z"/>
    <path d="M630 274 l-4 -8 h8 z"/>
    <path d="M830 349 l-4 -8 h8 z"/>
  </g>

  <!-- legend -->
  <g font-size="12.5" fill="#222">
    <rect x="30" y="425" width="18" height="12" fill="#3B2A6B"/><text x="54" y="436">이름이 불리는 수여 시간</text>
    <rect x="230" y="425" width="18" height="12" fill="#9A8FB8"/><text x="254" y="436">식전 연주·사이 시간</text>
    <rect x="410" y="425" width="18" height="12" fill="#FFFFFF" stroke="#9A8FB8"/><text x="434" y="436">입장·학과 자율</text>
    <text x="970" y="436" text-anchor="end">개념도(축척 없음)</text>
  </g>
</svg>
